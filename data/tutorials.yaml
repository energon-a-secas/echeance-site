# Renewal tutorials: the real steps to obtain, renew and revoke each
# kind of credential the fleet depends on. One entry per tutorial.
#
# This file feeds two consumers:
#   - the Tutorials view in the site (fetched at runtime)
#   - llms.txt at the site root (regenerate with `make llms`)
# Edit here, never in llms.txt.
#
# Rules for entries: steps and insights carry commands and traps, never
# secret values, never IP addresses, never account emails.

tutorials:
  - id: convex-cli
    title: Renew Convex CLI auth
    service: Convex
    applies_to: oauth-session
    signals:
      - "`npx convex deploy` or `npx convex dev` fails with an authentication error"
      - "Convex deploys have been blocked since the last login went stale"
    steps:
      - "Open a real interactive terminal. The login is a browser OAuth flow; it cannot run from a non-interactive session, so an agent must hand this step to a person."
      - "From the Convex project directory (for the fleet: `projects/memes-site`), run `npx convex login`."
      - "Complete the browser prompt with the Convex account."
    verify: "`npx convex dev --once` from the project directory completes without an auth error."
    revoke: "Log out with `npx convex logout`, or revoke the session from the Convex dashboard settings."
    insights:
      - "The CLI token goes stale silently: nothing warns before a deploy fails. The fleet's token minted 2026-05-28 was dead by late August, so treat roughly 90 days as the working lifetime and record the login date."
      - "Renewal is the one step in the fleet's deploy chain that cannot be automated; schedule it, do not discover it."
    links:
      - label: Convex dashboard
        url: https://dashboard.convex.dev/

  - id: wrangler-oauth
    title: Renew the Cloudflare wrangler session
    service: Cloudflare
    applies_to: oauth-session
    signals:
      - "`wrangler deploy` or `wrangler secret put` fails with an auth error"
    steps:
      - "Check who the CLI thinks you are: `wrangler whoami`."
      - "If the session is stale, run `wrangler login` (browser OAuth; needs an interactive terminal)."
      - "Worker secrets are written from the worker's own directory with `wrangler secret put NAME`; `worker/wrangler.toml` names the worker."
    verify: "`wrangler whoami` reports the expected account."
    revoke: "`wrangler logout`, or revoke the authorization under the Cloudflare dashboard's API tokens page."
    insights:
      - "No long-lived token is stored anywhere in the repo; the OAuth session is cached locally. When a deploy fails, check `wrangler whoami` before touching any secret."
      - "Deploys and secret writes are per-account, so a whoami mismatch explains most sudden 403s."
    links:
      - label: Cloudflare dashboard
        url: https://dash.cloudflare.com/

  - id: r2-cdn-token
    title: Rotate the R2 API token behind the CDN publish
    service: Cloudflare R2
    applies_to: api-key
    signals:
      - "`upload-assets.js` fails, or the cdn repo's Actions publish run fails"
    steps:
      - "Decode the error first; most failures are not a dead credential. `Unauthorized`: token dead or revoked. `SignatureDoesNotMatch`: secret mis-pasted (R2 secrets are exactly 64 hex chars, check the length). `code 9109 Cannot use the access token from location`: client IP allowlist rejection, not a credential problem."
      - "To rotate: Cloudflare dashboard, R2, Manage R2 API Tokens. One R2 API token issues both the S3 key pair and the Cloudflare API token; they share one lifecycle."
      - "Update the local `.env` in `projects/neorgon-cdn-site/` (`CLOUDFLARE_ACCOUNT_ID`, `R2_ACCESS_KEY_ID`, `R2_SECRET_ACCESS_KEY`)."
      - "Update the same values as GitHub Actions secrets on the cdn repo; the Actions pipeline publishes on push."
    verify: "Push to the cdn repo and watch the Actions publish run, or run `upload-assets.js` locally."
    revoke: "Delete the token under Manage R2 API Tokens; both halves die together."
    insights:
      - "The IP-filter trap (hit 2026-08-03): allowlisting the machine's IPv6 address breaks within hours, because IPv6 privacy extensions rotate the suffix. Allowlist the stable IPv4, or a CIDR block."
      - "The CI token must have no client IP allowlist at all: GitHub runners rotate IPs, so an allowlisted token fails every run with code 9109. Mint a separate unfiltered token for CI if the interactive one is filtered."

  - id: gh-cli
    title: Fix GitHub CLI auth and account switching
    service: GitHub
    applies_to: oauth-session
    signals:
      - "`gh repo create` fails with a permissions error"
      - "`gh` commands act as the wrong account"
    steps:
      - "See every logged-in account and which is active: `gh auth status`."
      - "Switch with `gh auth switch --user <name>`; log a missing account in with `gh auth login` (browser flow)."
      - "Repo creation in the fleet's org must run as the account that owns it; switch before `gh repo create`, not after it fails."
    verify: "`gh auth status` shows the intended account as active."
    revoke: "`gh auth logout --user <name>`, or revoke the device under GitHub Settings, Applications."
    insights:
      - "Two personas are logged in on this machine and only one has repo-create rights in the org; `gh auth status` first is cheaper than a failed create."
      - "git identity is separate from gh identity: commits need the right `user.name`/`user.email` per repo even when gh is on the right account."

  - id: github-ssh
    title: Verify SSH push access to GitHub
    service: GitHub
    applies_to: ssh-key
    signals:
      - "`git push` asks for credentials or is refused"
    steps:
      - "Test the key: `ssh -T git@github.com` (expect the greeting with the right username)."
      - "If refused, check the agent has the key loaded: `ssh-add -l`."
      - "Remotes should use the SSH form (`git@github.com:owner/repo.git`); check with `git remote -v`."
    verify: "`ssh -T git@github.com` greets the expected account."
    revoke: "Remove the key under GitHub Settings, SSH and GPG keys."
    insights:
      - "SSH pushes work from agent sessions since 2026-08-18; the old HTTPS token workaround is retired. If a session claims it cannot push, the remote URL form is the first suspect."

  - id: namecheap-dns
    title: Restore Namecheap DNS API access
    service: Namecheap
    applies_to: ip-whitelist
    signals:
      - "DNS tooling fails with an API error after changing networks"
    steps:
      - "The API is IP-whitelisted and breaks on every network change, not only first setup. Check what IP you present: `make -C tooling/dns whoami` (run it in the current shell)."
      - "Add that IP at Namecheap, Profile, Tools, API Access."
      - "The key itself lives in a gitignored `.env` (`NAMECHEAP_API_KEY`); it does not rotate with the IP."
    verify: "Re-run the DNS command that failed; then commit the fresh zone backup the tooling writes."
    revoke: "Disable API access on the same Namecheap page."
    insights:
      - "Treat the whitelist as the credential: the key survives network changes, the allowlisted IP does not."
      - "After any DNS change, commit the zone backup file; its git history is the zone's only portable backup."

  - id: steam-web-api
    title: Obtain or rotate a Steam Web API key
    service: Valve Steam
    applies_to: api-key
    signals:
      - "The Steam-backed endpoint answers NOT_CONFIGURED or upstream 401s"
    steps:
      - "Request the key at steamcommunity.com/dev/apikey with a non-limited Steam account (Valve lifts the limit only after USD 5 spent from the store)."
      - "The form's domain field is an identifier, not a technical binding."
      - "Store it as a worker secret, never in a file: `wrangler secret put STEAM_API_KEY` from the worker directory, then `wrangler deploy`."
    verify: "Call the worker endpoint from outside; expect a JSON envelope, with NOT_CONFIGURED meaning the secret did not land."
    revoke: "The same page has Revoke My Steam Web API Key. Revoke immediately if the key ever appears in a commit, a log or a paste, then re-put the secret."
    insights:
      - "A bare `Forbidden` from the endpoint means the old worker is still deployed, not that the key is bad."
      - "Registering or revoking may require confirming in the Steam Mobile app."
    links:
      - label: Steam API key page
        url: https://steamcommunity.com/dev/apikey

  - id: github-enforcer-token
    title: Renew the github-enforcer GitHub token
    service: GitHub
    applies_to: api-key
    signals:
      - "`make -C tooling/github-enforcer check` stops with 401 Bad credentials"
      - "The enforcer warns at startup that the token is not 40 or 93 characters long"
      - "Repo policy drift stops being reported, so descriptions, homepages and topics quietly stop being enforced across the fleet"
    steps:
      - "Read the length before minting anything. A classic PAT is exactly 40 characters and a fine-grained one is 93. Any other length means the line in .env is malformed and the credential may be perfectly alive, so repair the line first and mint nothing."
      - 'Confirm the token itself is dead before replacing it: curl -sS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/user . A 200 means the token is alive and the fault is elsewhere; a 401 means it is genuinely gone.'
      - "Mint the replacement at github.com/settings/tokens. A classic token needs the `repo` scope. A fine-grained token needs, on the energon-a-secas repos: Administration read and write, Contents read and write, Metadata read, Pages read and write, Pull requests read and write."
      - "Install it by replacing the whole GITHUB_TOKEN line in `tooling/github-enforcer/.env`. Paste it as one line with nothing after it: no trailing comment, no wrapped remainder, no second value."
      - "Restrict the file: `chmod 600 tooling/github-enforcer/.env`. Gitignored is not the same as private, and this token can delete repositories."
      - "Record the new expiry date on the inventory entry github-enforcer-token, so the reminder fires before the next failure instead of after it."
    verify: "`make -C tooling/github-enforcer check-repo REPO=energon-a-secas/neorgon-site` prints all checks passed, with no length warning at startup."
    revoke: "Delete it under github.com/settings/tokens. A classic token is not scoped to a repo, so it dies everywhere at once."
    insights:
      - "401 Bad credentials does not mean expired. On 2026-09-05 the .env line held a valid 40-character classic PAT with 75 characters of pasted text stuck to the end, so the whole 115-character string went out and GitHub rejected it. The token had been alive the entire time, and this inventory had already recorded the credential as dead and told a future reader to mint a replacement. Check the length before believing the 401."
      - "The enforcer now says this itself: it warns at startup on a wrong-length value, and on a 401 it prints malformed rather than expired whenever the length matches no documented shape."
      - "Prefer a fine-grained token. A classic one carries every scope you tick across every repo the account can reach, delete_repo included, which is a wide blast radius for a tool whose job is editing descriptions and topics."
      - "Pages read and write is the permission most easily left off, and its absence used to pass as success: GitHub answers 404 rather than 403 for a Pages endpoint the token cannot see, which is the same answer as Pages being switched off. The enforcer now separates the two and warns when a repo has Pages enabled but the token cannot read it."
    links:
      - label: GitHub personal access tokens
        url: https://github.com/settings/tokens
      - label: Permissions required for fine-grained tokens
        url: https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens

  - id: reddit-data-api-app
    title: Obtain or reuse a Reddit Data API app (Bouquin)
    service: Reddit
    applies_to: api-key
    signals:
      - "bouquin.neorgon.com reports its last scan came from the archive, not from Reddit"
      - "`npx convex run ingest:scan --prod` returns status skipped, or a token error mentioning 401"
      - "Reddit's app-registration deadline (2026-09-30) is approaching and an existing app is not registered"
    steps:
      - "Know what changed before touching anything. Reddit closed self-service Data API registration on 2025-11-11 (r/redditdev post 1oug31u, 'Introducing the Responsible Builder Policy'); every new OAuth app is approved by a person, and personal read-only requests reportedly wait weeks. The site does not depend on this: `convex/ingest.ts` reads the Arctic Shift archive until the env vars exist."
      - "Check for an app you already own: log in and open reddit.com/prefs/apps. An app of type script or web app listed under 'developed applications' shows its client id under its name and its secret in the edit view. That is the fast path."
      - "If one exists, register it at developers.reddit.com/app-registration before 2026-09-30 (asked for in the 2026-08-05 admin post 1vgbm9c, 'to remain in good standing'). Describe it as personal, non-commercial, read-only, one subreddit, about 60 requests per hour."
      - "If none exists, file the access request at support.reddithelp.com/hc/en-us/requests/new?ticket_form_id=14868593862164 (the link Reddit's own 'Accessing Reddit Data' article gives for non-commercial use), and note the date on this inventory entry. Trying 'create another app' on prefs/apps costs nothing, but r/redditdev has reported that form resetting silently or failing with a 500 since July 2026."
      - "With an id and secret in hand, run `bash scripts/setup-reddit.sh` from `projects/bouquin-site`. It captures the id, the secret (hidden), and your username for the User-Agent `web:com.neorgon.bouquin:v1.0 (by /u/NAME)`, writes them to the gitignored `.env`, and runs `npx convex env set` for REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET and REDDIT_USER_AGENT on the deployment you choose (prod, dev or both)."
      - "Nothing else changes: the next cron run picks the Reddit source by itself because `credsFromEnv()` now returns a value."
    verify: "`npx convex run ingest:scan --prod '{\"maxThreads\": 3}'` returns status ok and source reddit, and the stats line under the site's hero says the last scan came from Reddit."
    revoke: "Delete the app at reddit.com/prefs/apps (the id and secret die together), then `npx convex env remove REDDIT_CLIENT_ID REDDIT_CLIENT_SECRET REDDIT_USER_AGENT --prod`; the next scan falls back to the archive with no other change."
    insights:
      - "The credential is optional for the site and only improves it: live scores and comment counts instead of the archive's 16-minute lag and 36-hour score refresh. Do not block a launch on it."
      - "App-only OAuth (grant_type=client_credentials) is all the cron uses, so no Reddit password ever reaches Convex; the token endpoint answers 401, not 403, from outside Reddit, which is how you tell a dead credential from a network block. The unauthenticated .json endpoints answer 403 to everything now and the RSS feed is limited to one request per minute, so neither is a fallback worth building."
      - "Reddit blocks generic User-Agents at the network edge. The 403 that produces looks like a credential failure and is not one; check the User-Agent before rotating anything."
      - "Token lifetime is 24 hours and the cron caches it in the kv table; a 401 on a read drops the cached token so the next run mints a fresh one. A 401 on the token endpoint itself is the id or secret."
      - "Two deadlines live on this entry: the 2026-09-30 registration of any existing app, and, after that, Reddit's stated plan to move third-party apps onto its Developer Platform 'gradually' with nothing changing in 2026. Re-read the r/redditdev admin posts before the next renewal rather than this note."
    links:
      - label: Your Reddit apps
        url: https://www.reddit.com/prefs/apps
      - label: App registration (deadline 2026-09-30)
        url: https://developers.reddit.com/app-registration
      - label: Data API access request form
        url: https://support.reddithelp.com/hc/en-us/requests/new?ticket_form_id=14868593862164
      - label: Responsible Builder Policy
        url: https://support.reddithelp.com/hc/en-us/articles/42728983564564-Responsible-Builder-Policy
      - label: Research report (fleet)
        url: https://github.com/energon-a-secas/bouquin-site
